[project]
name = "tinaja-bot-base"
version = "0.1.0"
description = "A small framework to build Discord bots for a custom server, based on tinaja-bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
tinaja-bot = "tinaja_base.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinaja_base"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
# templates contain $placeholders; examples are bot projects linted with their own settings
extend-exclude = ["tinaja_base/templates", "examples"]

[tool.ruff.lint]
# import sorting, pyupgrade and bugbear on top of the defaults
extend-select = ["I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"
