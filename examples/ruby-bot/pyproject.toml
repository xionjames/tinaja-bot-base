[project]
name = "ruby-bot"
version = "0.1.0"
description = "Ruby Bot, a Discord bot built on tinaja-bot-base with a Ruby plugin"
readme = "README.md"
requires-python = ">=3.14"
# Only the host that connects to Discord is Python; the bot's code is the Ruby in plugin/
dependencies = [
    "tinaja-bot-base",
]

[tool.uv.sources]
# The example tracks the framework in this repo; generated bots use a git source instead
tinaja-bot-base = { path = "../..", editable = true }
