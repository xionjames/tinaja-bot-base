[project]
name = "$bot_slug"
version = "0.1.0"
description = "$bot_name, a Discord bot built on tinaja-bot-base"
readme = "README.md"
requires-python = ">=3.14"
# Only the host that connects to Discord is Python; the bot's code is the TypeScript in plugin/
dependencies = [
    "tinaja-bot-base",
]

[tool.uv.sources]
tinaja-bot-base = $framework_source
