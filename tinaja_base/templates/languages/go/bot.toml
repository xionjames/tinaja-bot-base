# Settings for $bot_name. The token is not here: put DISCORD_BOT_TOKEN in .env (see env.sample).
name = "$bot_name"
prefix = "!"
context_file = "CONTEXT.md" # the glossary, answered by !glossary [term]

[intents]
message_content = true # read message text: needed for prefix commands and for reading the channel
members = false
presences = false

[replies]
# Plain-text commands, no code needed. {author} mentions whoever asked, {prefix} is the prefix above.
ping = "pong {author}"
# Reserved: the answer to an unknown Command. {command} is what they typed after the prefix.
fallback = "Sorry {author}, I don't know {prefix}{command}. Try {prefix}help"

[mentions]
as_prefix = true # "@Bot hello" works the same as "!hello"; also needed for on_mention in the plugin

[plugins.main]
# The Go code of the bot: its Commands and listeners. See plugin/main.go
# ./bot is built from it: run "go build -o bot ." in plugin/ after every change (the Docker image builds it too)
cwd = "plugin"
run = "./bot"
