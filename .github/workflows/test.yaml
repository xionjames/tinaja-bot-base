name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Test the example bot
        working-directory: examples/hello-bot
        run: |
          uv sync --locked
          uv run ruff check --output-format=github .
          uv run ruff format --check .
          uv run pytest

  ruby:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Test the Ruby SDK
        working-directory: sdk/ruby
        run: |
          bundle install
          bundle exec rake test

      - name: Check the Ruby SDK against the protocol recordings
        run: uv run --no-project python sdk/conformance/run.py -- ruby sdk/ruby/conformance/plugin.rb

      - name: Test the Ruby example bot
        working-directory: examples/ruby-bot
        run: |
          uv sync --locked
          cd plugin && bundle install && bundle exec rake test
